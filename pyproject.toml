[project]
name = "cockroachdb-mcp-server"
version = "0.2.0"
description = "CockroachDB MCP Server - Model Context Protocol server for CockroachDB"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Amine El Kouhen", email = "amine.elkouhen@cockroachlabs.com"}
]
keywords = ["CockroachDB", "MCP", "model-context-protocol", "AI", "LLM"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp[cli]>=1.9.4",
    "python-dotenv>=1.0.0",
    "click>=8.0.0",
    "asyncpg>=0.30.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[project.urls]
Homepage = "https://github.com/amineelkouhen/mcp-cockroachdb"
Repository = "https://github.com/amineelkouhen/mcp-cockroachdb"
Issues = "https://github.com/amineelkouhen/mcp-cockroachdb/issues"

[project.scripts]
cockroachdb-mcp-server = "src.main:cli"

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
